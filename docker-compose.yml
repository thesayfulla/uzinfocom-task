services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    env_file:
      - .env
    ports:
      - "${API_PORT}:8080"
    command: ["./server.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cron
    env_file:
      - .env
    command: ["./cron.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  db:
    image: postgres:17-alpine
    container_name: database
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
